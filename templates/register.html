{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px">
<h1>Create an account</h1>
<form method="post">{{ csrf_field() }}
  <label>Full name</label><input type="text" name="name" value="{{ request.form.name }}" required>
  <label>Affiliation</label><input type="text" name="affiliation" value="{{ request.form.affiliation }}" required>
  <label>Email</label><input type="email" name="email" value="{{ request.form.email }}" required>
  <label>Password <span class="hint">(at least 8 characters)</span></label><input type="password" name="password" required>
  <label>Confirm password</label><input type="password" name="password2" required>
  <p><button>Create account</button></p>
</form>
<p class="small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}

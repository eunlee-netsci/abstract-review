{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px">
<h1>Log in</h1>
<form method="post">{{ csrf_field() }}
  <label>Email</label><input type="email" name="email" value="{{ request.form.email }}" required autofocus>
  <label>Password</label><input type="password" name="password" required>
  <p><button>Log in</button></p>
</form>
<p class="small"><a href="{{ url_for('forgot') }}">Forgot password / reviewers setting a password for the first time</a><br>
No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px">
<h1>Set your password</h1>
<p class="muted">{{ u.email }}</p>
<form method="post">{{ csrf_field() }}
  <label>Full name</label><input type="text" name="name" value="{{ u.name }}">
  <label>Affiliation</label><input type="text" name="affiliation" value="{{ u.affiliation }}">
  <label>New password <span class="hint">(at least 8 characters)</span></label><input type="password" name="password" required>
  <label>Confirm password</label><input type="password" name="password2" required>
  <p><button>Save</button></p>
</form>
</div>
{% endblock %}
